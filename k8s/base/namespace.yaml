# ===========================================================================
# Namespace with Pod Security Admission enforced at the "restricted" level.
#
# This is the cheapest, highest-value Kubernetes security control there is:
# the API server rejects privileged pods, hostPath mounts, host networking
# and root containers before they are ever scheduled.
# ===========================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: erp
  labels:
    name: erp
    environment: dev
    # Pod Security Standards
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # Needed by the NetworkPolicy namespaceSelector rules
    kubernetes.io/metadata.name: erp
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: erp-quota
  namespace: erp
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.memory: 16Gi
    pods: "50"
    persistentvolumeclaims: "4"
    services.loadbalancers: "0"   # no surprise public IPs from this namespace
    count/jobs.batch: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: erp-limits
  namespace: erp
spec:
  limits:
    - type: Container
      # Anything deployed without resources gets these, so a forgotten
      # request cannot starve a node.
      default:
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
      min:
        cpu: 10m
        memory: 32Mi
