{{/*
One ServiceAccount per workload, each federated to its OWN managed identity.
The azure.workload.identity/client-id annotation is the whole trick: the
mutating webhook sees it, projects a token into the pod, and the Azure SDK
exchanges that token for an Entra access token.
*/}}
{{- range $name, $sa := dict "api" .Values.azure.workloadIdentity.api "web" .Values.azure.workloadIdentity.web "worker" .Values.azure.workloadIdentity.worker "migrate" .Values.azure.workloadIdentity.migrate }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: erp-{{ $name }}-sa
  namespace: {{ $.Values.namespace }}
  labels:
    {{- include "erp.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
  {{- if $.Values.azure.workloadIdentity.enabled }}
  annotations:
    azure.workload.identity/client-id: {{ $sa.clientId | quote }}
    azure.workload.identity/tenant-id: {{ $.Values.azure.tenantId | quote }}
  {{- end }}
# No automatic API token: these pods never call the Kubernetes API.
automountServiceAccountToken: false
{{- end }}
