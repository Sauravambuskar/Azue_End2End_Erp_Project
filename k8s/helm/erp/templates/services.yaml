apiVersion: v1
kind: Service
metadata:
  name: {{ include "erp.name" . }}-api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # ClusterIP, never LoadBalancer: the API is reachable only from inside the
  # cluster. All external traffic enters through the ingress -> web tier.
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.api.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "erp.name" . }}
    app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "erp.name" . }}-web
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "erp.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.web.port }}
      targetPort: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "erp.name" . }}
    app.kubernetes.io/component: web
