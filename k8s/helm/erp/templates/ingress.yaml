{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "erp.name" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "erp.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if and .Values.ingress.host .Values.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName }}
  {{- end }}
  rules:
    - {{- if .Values.ingress.host }}
      host: {{ .Values.ingress.host | quote }}
      {{- end }}
      http:
        paths:
          # Only the web tier is published. /api is NOT routed from the edge:
          # the browser talks to /bff on the web tier, which calls the API
          # server-side. One less internet-reachable surface.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "erp.name" . }}-web
                port:
                  number: {{ .Values.web.port }}
{{- end }}
