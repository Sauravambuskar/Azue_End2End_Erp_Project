{{- if .Values.config.keyVault.enabled }}
# ===========================================================================
# Key Vault CSI driver. Mounts secrets as files AND syncs them to a
# Kubernetes Secret so they can be used as env vars.
#
# Interview nuance: syncing to a K8s Secret means the value is in etcd. The
# file mount alone keeps it out of etcd entirely. Sync only what genuinely
# must be an env var - here, just the App Insights connection string.
# ===========================================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: erp-keyvault
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "erp.labels" . | nindent 4 }}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    # Workload identity: the CSI driver uses the pod's federated token.
    clientID: {{ .Values.azure.workloadIdentity.api.clientId | quote }}
    keyvaultName: {{ .Values.config.keyVault.name | quote }}
    tenantId: {{ .Values.config.keyVault.tenantId | default .Values.azure.tenantId | quote }}
    objects: |
      array:
        - |
          objectName: erp-appinsights-connection-string
          objectType: secret
          objectAlias: appinsights-connection-string
        - |
          objectName: erp-api-signing-key
          objectType: secret
          objectAlias: api-signing-key
  secretObjects:
    - secretName: {{ .Values.config.appInsights.secretName }}
      type: Opaque
      data:
        - objectName: appinsights-connection-string
          key: appinsights-connection-string
{{- end }}
