# Prod overrides: the posture you describe in the interview.
config:
  env: prod
  logLevel: INFO
  authEnabled: true          # Entra ID / Okta token validation ON
  db:
    useManagedIdentity: true
    sslmode: require
  keyVault:
    enabled: true

api:
  replicaCount: 3
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      memory: 1Gi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 60
  podDisruptionBudget:
    enabled: true
    minAvailable: 2

web:
  replicaCount: 3
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 12

worker:
  schedule: "0 * * * *"

ingress:
  enabled: true
  className: azure-application-gateway
  host: erp.contoso-lab.com
  tlsSecretName: erp-tls

networkPolicy:
  enabled: true

topologySpreadEnabled: true

image:
  pullPolicy: IfNotPresent     # never :latest, never Always with a digest tag
