# ===========================================================================
# Gitleaks configuration for ContosoERP.
#
# Extends the default ruleset (which already covers AWS keys, GitHub tokens,
# private keys and so on) and adds Azure-specific and ERP-specific rules.
#
# Verify a change to this file by running it against the whole repository:
#   gitleaks dir . --config security/secrets/gitleaks.toml --redact
# Expected result: 0 findings. Anything else is either a real secret or a
# bug in this file.
# ===========================================================================
title = "ContosoERP secret scanning"

[extend]
useDefault = true

# --------------------------------------------------------------- custom rules
# Each of these corresponds to a credential type that has caused real
# incidents in Azure estates.

[[rules]]
id = "azure-storage-connection-string"
description = "Azure Storage account connection string"
regex = '''DefaultEndpointsProtocol=https?;AccountName=[a-z0-9]{3,24};AccountKey=[A-Za-z0-9+/=]{64,}'''
tags = ["azure", "storage", "critical"]

[[rules]]
id = "azure-sql-connection-string"
description = "Azure SQL / PostgreSQL connection string with an inline password"
regex = '''(?i)(server|host)=[^;\s]+;.*(password|pwd)=[^;\s]{8,}'''
tags = ["azure", "database", "critical"]

[[rules]]
id = "postgres-uri-with-password"
description = "PostgreSQL URI containing a password"
regex = '''postgres(ql)?(\+\w+)?:\/\/[^:\/\s]+:[^@\/\s]{6,}@'''
tags = ["database", "critical"]

[[rules]]
id = "azure-sas-token"
description = "Azure shared access signature token"
regex = '''sig=[A-Za-z0-9%+\/=]{40,}&?.*(sp=|se=|sv=)'''
tags = ["azure", "sas"]

[[rules]]
id = "azure-ad-client-secret"
description = "Entra ID application client secret"
regex = '''(?i)(client_secret|clientsecret|aad_secret)["'\s:=]+[A-Za-z0-9~._\-]{32,}'''
tags = ["azure", "entra", "critical"]

[[rules]]
id = "appinsights-connection-string"
description = "Application Insights connection string"
regex = '''InstrumentationKey=[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'''
tags = ["azure", "telemetry"]

[[rules]]
id = "kubeconfig-client-certificate"
description = "Embedded kubeconfig client certificate data"
regex = '''client-key-data:\s*[A-Za-z0-9+\/=]{100,}'''
tags = ["kubernetes", "critical"]

[[rules]]
id = "terraform-state-inline-secret"
description = "Terraform tfvars or state containing a literal administrator password"
# The negated character class must exclude:
#   $  Terraform and shell interpolation:  "${var.x}" / "$(cmd)"
#   \  an escaped $ inside a heredoc:      "\$(openssl rand ...)"
#   v  the start of  var.
# Without those exclusions this rule fires on every correctly-parameterised
# password in the repo. Found by running this scanner against this repository,
# which is the only way to know your own rules work.
regex = '''(?i)(administrator_login_password|admin_password)\s*=\s*"[^"$\\v][^"]{7,}"'''
tags = ["terraform", "critical"]

# ------------------------------------------------------------------ allowlist
#
# EVERY ENTRY HERE IS A HOLE YOU DELIBERATELY CUT. Keep them narrow, and
# review changes to this section as carefully as code.
#
# Note the [/\\] in every path pattern. Gitleaks reports paths using the host
# OS separator, so a pattern written only with "/" silently fails to match on
# Windows. That bug made a genuine 0-finding repository report 461 findings -
# which is exactly how a security gate loses credibility and gets switched off.

[allowlist]
description = "Dependencies, tool caches, documented placeholders and test fixtures"

paths = [
  # --- not our code: vendored dependencies and build output ---
  # `gitleaks dir` does not reliably honour .gitignore, so these have to be
  # excluded explicitly or the real signal is buried.
  '''(^|[/\\])\.venv[/\\]''',
  '''(^|[/\\])venv[/\\]''',
  '''(^|[/\\])node_modules[/\\]''',
  '''(^|[/\\])\.terraform[/\\]''',
  '''(^|[/\\])site-packages[/\\]''',
  '''(^|[/\\])dist[/\\]''',

  # --- tool caches and scanner output ---
  '''(^|[/\\])\.pytest_cache[/\\]''',
  '''(^|[/\\])\.ruff_cache[/\\]''',
  '''(^|[/\\])\.mypy_cache[/\\]''',
  '''(^|[/\\])__pycache__[/\\]''',
  '''gl-report\.json$''',
  '''\.sarif$''',

  # --- documentation ---
  # The guide shows placeholder credentials on purpose, including deliberately
  # leaked fixtures used to prove this very gate works. See guidance/09 §5.
  '''(^|[/\\])guidance[/\\]''',

  # --- example files, which exist to be copied and filled in ---
  '''\.example$''',

  # --- this file, whose own regexes look like the things they match ---
  '''(^|[/\\])security[/\\]secrets[/\\]gitleaks\.toml$''',

  # --- provider lock file: hashes, not secrets ---
  '''\.terraform\.lock\.hcl$''',
]

regexes = [
  # Documented local-development-only values
  '''ChangeMeLocally123!''',
  '''localpw''',

  # Obvious placeholders
  '''(?i)(your|my|example|placeholder|dummy|fake|sample|redacted|changeme|xxxx)[-_]?(password|secret|key|token)''',
  '''0{8}-0{4}-0{4}-0{4}-0{12}''',
  '''1{8}-1{4}-1{4}-1{4}-1{12}''',

  # Interpolation, not a literal
  '''password\s*=\s*"?\$\{''',
  '''password\s*=\s*"?\$\(''',
  '''password\s*=\s*var\.''',
  '''password\s*=\s*random_password''',
  '''password\s*=\s*null''',
  '''PGPASSWORD=\$\(''',

  # Public, documented identifiers that merely look like secrets
  '''ossrdbms-aad\.database\.windows\.net''',
  '''api://AzureADTokenExchange''',
]

stopwords = [
  "placeholder",
  "example",
  "changeme",
  "redacted",
]
