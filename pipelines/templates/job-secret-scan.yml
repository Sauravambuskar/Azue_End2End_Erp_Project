# ===========================================================================
# Secrets scanning with Gitleaks.
#
# HARD FAIL, always. Rationale to give in the interview: a leaked secret is
# already compromised the moment it is pushed - you cannot "fix it later",
# you have to rotate it. So the gate must block the merge, not warn.
#
# Two modes:
#   * PR builds scan only the commits in the PR (fast).
#   * main builds scan full history (catches anything that slipped in before
#     the gate existed).
# ===========================================================================
parameters:
  - name: name
    type: string
    default: secret_scan
  - name: failOnFinding
    type: boolean
    default: true

jobs:
  - job: ${{ parameters.name }}
    displayName: Secret scanning (Gitleaks)
    pool:
      vmImage: ubuntu-latest
    steps:
      - checkout: self
        # Full history is required for the main-branch deep scan.
        fetchDepth: 0
        persistCredentials: false

      - script: |
          set -euo pipefail
          VER="$(gitleaksVersion)"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version
        displayName: Install Gitleaks (pinned version)

      - script: |
          set -euo pipefail
          if [ "$(Build.Reason)" = "PullRequest" ]; then
            echo "PR build: scanning only the diff against the target branch."
            git fetch origin "$(System.PullRequest.TargetBranch)" --depth=50
            RANGE="origin/$(System.PullRequest.TargetBranchName)..HEAD"
            gitleaks git --log-opts="$RANGE" \
              --config security/secrets/gitleaks.toml \
              --report-format sarif --report-path gitleaks.sarif \
              --redact --verbose --exit-code 1
          else
            echo "Branch build: scanning full history."
            gitleaks git \
              --config security/secrets/gitleaks.toml \
              --report-format sarif --report-path gitleaks.sarif \
              --redact --verbose --exit-code 1
          fi
        displayName: Scan git history
        continueOnError: ${{ not(parameters.failOnFinding) }}

      - script: |
          set -euo pipefail
          # Also scan the working tree: catches a secret staged but not yet
          # committed in a locally-built artifact.
          gitleaks dir . \
            --config security/secrets/gitleaks.toml \
            --report-format sarif --report-path gitleaks-dir.sarif \
            --redact --exit-code 1
        displayName: Scan working tree
        continueOnError: ${{ not(parameters.failOnFinding) }}

      - publish: gitleaks.sarif
        artifact: gitleaks-report
        displayName: Publish SARIF report
        condition: succeededOrFailed()
        continueOnError: true

      - script: |
          echo "A finding here means: ROTATE the credential, then remove it"
          echo "from history with git filter-repo. Deleting the line in a new"
          echo "commit does NOT remove it from the repository."
        displayName: Remediation guidance
        condition: failed()
